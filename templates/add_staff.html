{% extends "base.html" %}

{% block content %}
<div class="dashboard-card">
    <h1>Add Maintenance Staff</h1>
    <p>Create a new staff account for the maintenance team.</p>

    <form method="POST" action="{{ url_for('add_staff') }}">

        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name"
               placeholder="Enter staff name" required>

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email"
               placeholder="Enter staff email" required>

        <label for="password">Password *</label>
        <input type="password" id="password" name="password"
               placeholder="Minimum 8 characters" minlength="8" required>

        <label for="department">Department</label>
        <input type="text" id="department" name="department"
               placeholder="e.g. Electrical Maintenance">

        <button type="submit" class="btn">Create Staff Account</button>

        <a href="{{ url_for('manage_staff') }}" class="btn">
            Back to Manage Staff
        </a>
    </form>
</div>
{% endblock %}

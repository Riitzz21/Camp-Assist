{% extends "base.html" %}

{% block content %}

<div class="dashboard-card">

    <h1>Submit Your Feedback</h1>

    <p>Share your experience with our maintenance team.</p>

    <h3>Complaint #{{ complaint.id }}</h3>

    <p><strong>Title:</strong> {{ complaint.title }}</p>

    <p><strong>Status:</strong> {{ complaint.status }}</p>

    <form method="POST"
          action="{{ url_for('submit_feedback', complaint_id=complaint.id) }}">

        <label for="rating">Rate the Maintenance Service *</label>

        <select name="rating" id="rating" required>
            <option value="">Select Rating</option>
            <option value="5">★★★★★ - Excellent</option>
            <option value="4">★★★★ - Very Good</option>
            <option value="3">★★★ - Good</option>
            <option value="2">★★ - Average</option>
            <option value="1">★ - Poor</option>
        </select>

        <br><br>

        <label for="comments">Your Feedback</label>

        <textarea
            name="comments"
            id="comments"
            rows="5"
            placeholder="Write your experience with the maintenance service..."
        ></textarea>

        <br><br>

        <button type="submit" class="btn">
            Submit Feedback
        </button>

        <a href="{{ url_for('my_complaints') }}" class="btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
